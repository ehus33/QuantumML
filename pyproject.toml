[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-healthcare-optimizer"
version = "0.1.0"
description = "Qiskit starter repo for healthcare resource allocation with QAOA"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Ethan"}]
dependencies = [
  "qiskit>=1.2",
  "qiskit-aer>=0.15",
  "qiskit-algorithms>=0.3",
  "qiskit-optimization>=0.7",
  "qiskit-machine-learning>=0.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "docplex>=2.28",
  "matplotlib>=3.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
